# FlowBoard edge configuration.
#
# One container does two jobs:
#   1. serve the built single-page app,
#   2. reverse-proxy /api to the API container, which lives on an internal-only
#      Docker network so it is unreachable from outside the stack.
#
# The image is nginx-unprivileged: the worker runs as a non-root UID and binds
# an unprivileged port, so no Linux capabilities are required at runtime. Paths
# that must stay writable (pid file, proxy temp dirs) live under /tmp.
#
# Notes that matter operationally:
#   * `api` is resolved once at start-up, so the API must be healthy first
#     (docker compose `depends_on: condition: service_healthy`).
#   * Server tokens and version banners are suppressed.
#   * Cache-Control is set with `expires` rather than `add_header` in locations
#     so the server-level security headers keep being inherited everywhere.

worker_processes  auto;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable scratch space that survives `read_only: true` via tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Structured access logs are easy to ship and to grep.
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"agent":"$http_user_agent",'
        '"requestTime":$request_time,'
        '"upstreamTime":"$upstream_response_time",'
        '"requestId":"$http_x_request_id"}';

    access_log /dev/stdout json_combined;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 4096;

    # Uploads are small JSON bodies; anything larger is a mistake or an attack.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Edge rate limiting. The API applies its own per-account limits as well;
    # this is the cheap first line of defence against credential stuffing.
    limit_req_zone $binary_remote_addr zone=flowboard_auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=flowboard_api:10m rate=600r/m;
    limit_req_status 429;

    # The API container is reached by service name on the internal network.
    upstream flowboard_api {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        # Unprivileged port: the container never needs NET_BIND_SERVICE.
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- security headers (inherited by every location below) -----------
        add_header X-Content-Type-Options       "nosniff" always;
        add_header X-Frame-Options              "DENY" always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # The SPA ships no inline scripts (the theme bootstrap is a real file),
        # so script-src can stay strict. Inline *styles* are required for
        # per-card colours and drag transforms.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # --- container orchestration probes ---------------------------------
        location = /healthz {
            access_log off;
            proxy_pass http://flowboard_api;
            include /etc/nginx/snippets/proxy.conf;
        }

        location = /readyz {
            access_log off;
            proxy_pass http://flowboard_api;
            include /etc/nginx/snippets/proxy.conf;
        }

        # --- realtime stream (Server-Sent Events) ---------------------------
        # Buffering must be off or events arrive in bursts; the read timeout has
        # to outlive the client's idle periods.
        location = /api/v1/events {
            proxy_pass http://flowboard_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /etc/nginx/snippets/proxy.conf;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding off;
            gzip off;
        }

        # --- authentication (stricter limit) --------------------------------
        location /api/v1/auth/ {
            limit_req zone=flowboard_auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://flowboard_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /etc/nginx/snippets/proxy.conf;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # --- the rest of the API --------------------------------------------
        location /api/ {
            limit_req zone=flowboard_api burst=120 nodelay;
            limit_req_status 429;

            proxy_pass http://flowboard_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /etc/nginx/snippets/proxy.conf;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # --- static assets ---------------------------------------------------
        # Vite fingerprints filenames, so they can be cached forever. `expires`
        # is used instead of add_header so the security headers are inherited.
        location /assets/ {
            expires max;
            access_log off;
            try_files $uri =404;
        }

        # The HTML shell must never be cached, or clients pin an old bundle.
        location = /index.html {
            expires -1;
        }

        location = /theme-init.js {
            expires 1h;
        }

        # SPA fallback: unknown paths render the app shell.
        location / {
            try_files $uri /index.html;
        }
    }
}
