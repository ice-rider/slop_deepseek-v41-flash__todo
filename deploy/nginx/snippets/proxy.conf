# Shared proxy headers for every API location.
#
# X-Forwarded-* are only trusted by the API when FLOWBOARD_TRUSTED_PROXIES is
# enabled, which is the case for this composed deployment.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;

# Never let an upstream response hug the connection open indefinitely.
proxy_set_header Connection        "";
