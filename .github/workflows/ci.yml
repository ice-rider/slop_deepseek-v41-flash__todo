# FlowBoard CI/CD
#
# Pipeline shape:
#   changes  → decide what actually needs building
#   backend  → gofmt, go vet, race tests with coverage, static build
#   frontend → typecheck, production bundle
#   images   → build both images with layer caching, lint the nginx config,
#              prove the API image boots and answers /readyz
#   e2e      → boot the real compose stack (isolated networks + nginx) and
#              exercise the product through the proxy, including SSE and a
#              network-isolation assertion
#   publish  → push versioned images to GHCR (main and v* tags)
#
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain to what go.mod declares instead of auto-downloading.
  GOTOOLCHAIN: local
  IMAGE_VERSION: 1.0.0

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build the server binary
        run: go build -trimpath -ldflags "-s -w" -o /tmp/flowboard-server ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + TS)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep this in step with package.json > packageManager.
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  images:
    name: Build container images
    needs: [changes, backend, frontend]
    if: always() && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: flowboard/api:${{ env.IMAGE_VERSION }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: flowboard/web:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Lint the nginx configuration
        run: docker run --rm --entrypoint nginx flowboard/web:${{ env.IMAGE_VERSION }} -t -c /etc/nginx/nginx.conf

      - name: Prove the API image boots and reports ready
        run: |
          set -euo pipefail
          docker run -d --name flowboard-api-probe \
            -e FLOWBOARD_ENV=production \
            -e FLOWBOARD_JWT_SECRET=ci-probe-secret \
            -e FLOWBOARD_DB_PATH=/tmp/probe.db \
            flowboard/api:${{ env.IMAGE_VERSION }}
          for _ in $(seq 1 30); do
            if docker exec flowboard-api-probe wget -q -O- http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "API answered /readyz"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API never became ready"
          docker logs flowboard-api-probe
          exit 1

  e2e:
    name: End-to-end through nginx
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: flowboard/api:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=api

      - name: Build the web image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: flowboard/web:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=web

      - name: Start the stack
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          sed -i "s|^FLOWBOARD_JWT_SECRET=.*|FLOWBOARD_JWT_SECRET=$(openssl rand -hex 32)|" deploy/.env
          sed -i "s|^FLOWBOARD_SEED_DEMO=.*|FLOWBOARD_SEED_DEMO=false|" deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait
          docker compose -f deploy/docker-compose.yml ps

      - name: Serve the SPA with hardened headers
        run: |
          set -euo pipefail
          base=http://localhost:8080
          headers="$(curl -fsSI "$base/")"
          echo "$headers"
          echo "$headers" | grep -qi 'content-security-policy'
          echo "$headers" | grep -qi 'x-content-type-options: nosniff'
          echo "$headers" | grep -qi 'x-frame-options: DENY'
          curl -fsS "$base/" | grep -q 'id="root"'
          curl -fsS "$base/theme-init.js" | grep -q "flowboard.ui"

      - name: API smoke test through the proxy
        run: |
          set -euo pipefail
          base=http://localhost:8080

          curl -fsS "$base/healthz" | jq -e '.status == "ok"' >/dev/null
          curl -fsS "$base/readyz" | jq -e '.status == "ready"' >/dev/null
          echo "health and readiness checks pass through nginx"

          session="$(curl -fsS -X POST "$base/api/v1/auth/register" \
            -H 'content-type: application/json' \
            -d '{"email":"ci-e2e@example.com","name":"CI Runner","password":"supersecret"}')"
          token="$(printf '%s' "$session" | jq -r '.accessToken')"
          [ "$token" != "null" ] || { echo "::error::registration returned no token"; exit 1; }

          created="$(curl -fsS -X POST "$base/api/v1/boards" \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"title":"CI board","template":"kanban"}')"
          board="$(printf '%s' "$created" | jq -r '.board.id')"
          columns="$(printf '%s' "$created" | jq -r '.snapshot.columns | length')"
          todo="$(printf '%s' "$created" | jq -r '.snapshot.columns[1].id')"
          done_col="$(printf '%s' "$created" | jq -r '.snapshot.columns[4].id')"
          [ "$columns" = "5" ] || { echo "::error::expected 5 template columns, got $columns"; exit 1; }
          echo "board created with the kanban template"

          card="$(curl -fsS -X POST "$base/api/v1/columns/$todo/cards" \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"title":"Shipped through nginx","priority":3}' | jq -r '.card.id')"

          curl -fsS -X POST "$base/api/v1/cards/$card/move" \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d "{\"columnId\":\"$done_col\",\"position\":0}" >/dev/null

          snapshot="$(curl -fsS "$base/api/v1/boards/$board" -H "authorization: Bearer $token")"
          landed="$(printf '%s' "$snapshot" | jq -r '.cards[0].columnId')"
          completed="$(printf '%s' "$snapshot" | jq -r '.cards[0].completedAt')"
          [ "$landed" = "$done_col" ] || { echo "::error::card stayed in $landed"; exit 1; }
          [ "$completed" != "null" ] || { echo "::error::completedAt was not stamped"; exit 1; }
          echo "card moved into the done column and was stamped complete"

          found="$(curl -fsS "$base/api/v1/search?q=nginx" -H "authorization: Bearer $token" | jq -r '.count')"
          [ "$found" = "1" ] || { echo "::error::search returned $found results"; exit 1; }
          echo "search finds the new card"

          echo "TOKEN=$token" >> "$GITHUB_ENV"
          echo "BOARD=$board" >> "$GITHUB_ENV"

      - name: Realtime stream is not buffered by nginx
        run: |
          set -euo pipefail
          # A buffered proxy would deliver nothing until the buffer filled, so
          # reading the first frame within a few seconds proves streaming works.
          timeout 15 curl -sN "http://localhost:8080/api/v1/events?boardId=$BOARD&access_token=$TOKEN" \
            | head -c 400 > /tmp/first-frame.txt || true
          cat /tmp/first-frame.txt
          grep -q 'event: hello' /tmp/first-frame.txt

      - name: The API is unreachable from the host and from the internet
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml"

          # `docker compose port` prints an error instead of nothing when a port
          # is unpublished, so inspect the binding table directly.
          api_id="$($compose ps -q api)"
          bindings="$(docker inspect "$api_id" --format '{{json .HostConfig.PortBindings}}')"
          if [ "$bindings" != "{}" ]; then
            echo "::error::the API publishes host ports: $bindings"
            exit 1
          fi
          echo "API publishes no host ports ($bindings)"

          # Only nginx should be reachable from the host.
          web_id="$($compose ps -q web)"
          web_bindings="$(docker inspect "$web_id" --format '{{json .HostConfig.PortBindings}}')"
          if [ "$web_bindings" = "{}" ]; then
            echo "::error::nginx published nothing, so the app is unreachable"
            exit 1
          fi
          echo "nginx publishes the edge port ($web_bindings)"

          # No outbound internet from the internal network.
          if $compose exec -T api wget -T 3 -q -O- http://example.com >/dev/null 2>&1; then
            echo "::error::the API reached the internet; the internal network is not isolating it"
            exit 1
          fi
          echo "API has no outbound internet access"

          # nginx can still reach it over the shared internal network.
          curl -fsS "http://localhost:8080/readyz" >/dev/null
          echo "nginx proxies the API over the internal network"

      - name: Containers run hardened
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml"
          for service in api web; do
            id="$($compose ps -q "$service")"
            readonly_rootfs="$(docker inspect "$id" --format '{{.HostConfig.ReadonlyRootfs}}')"
            caps="$(docker inspect "$id" --format '{{json .HostConfig.CapDrop}}')"
            user="$(docker inspect "$id" --format '{{.Config.User}}')"
            security="$(docker inspect "$id" --format '{{json .HostConfig.SecurityOpt}}')"
            echo "$service: readOnly=$readonly_rootfs capDrop=$caps user=$user security=$security"
            [ "$readonly_rootfs" = "true" ] || { echo "::error::$service root filesystem is writable"; exit 1; }
            case "$caps" in *ALL*) ;; *) echo "::error::$service has not dropped all capabilities"; exit 1;; esac
            case "$security" in *no-new-privileges*) ;; *) echo "::error::$service allows privilege escalation"; exit 1;; esac
            [ -n "$user" ] || { echo "::error::$service runs as root"; exit 1; }
          done

      - name: Container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  publish:
    name: Publish images to GHCR
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true

      - name: Publish the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true
