# FlowBoard CI/CD
#
# Pipeline shape:
#   changes  → decide what actually needs building
#   backend  → gofmt, go vet, race tests with coverage, static build
#   frontend → typecheck, production bundle
#   images   → build both images with layer caching, lint the nginx config,
#              prove the API image boots and answers /readyz
#   e2e      → boot the real compose stack (isolated networks + nginx) and
#              exercise the product through the proxy, including SSE and a
#              network-isolation assertion
#   publish  → push versioned images to GHCR (main and v* tags)
#
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain to what go.mod declares instead of auto-downloading.
  GOTOOLCHAIN: local
  IMAGE_VERSION: 1.0.0

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build the server binary
        run: go build -trimpath -ldflags "-s -w" -o /tmp/flowboard-server ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + TS)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep this in step with package.json > packageManager.
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  images:
    name: Build container images
    needs: [changes, backend, frontend]
    if: always() && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: flowboard/api:${{ env.IMAGE_VERSION }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: flowboard/web:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Lint the nginx configuration
        # One definition of the command, shared with `make docker-lint`. nginx
        # resolves upstream names when it loads the config, so a standalone
        # container needs a hosts entry for the compose service "api" or it
        # fails with "host not found in upstream". Real resolution is exercised
        # by the smoke and isolation checks below, which run against the stack.
        run: make docker-lint VERSION=${{ env.IMAGE_VERSION }}

      - name: Prove the API image boots and reports ready
        run: |
          set -euo pipefail
          docker run -d --name flowboard-api-probe \
            -e FLOWBOARD_ENV=production \
            -e FLOWBOARD_JWT_SECRET=ci-probe-secret \
            -e FLOWBOARD_DB_PATH=/tmp/probe.db \
            flowboard/api:${{ env.IMAGE_VERSION }}
          for _ in $(seq 1 30); do
            if docker exec flowboard-api-probe wget -q -O- http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "API answered /readyz"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API never became ready"
          docker logs flowboard-api-probe
          exit 1

  e2e:
    name: End-to-end through nginx
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: flowboard/api:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=api

      - name: Build the web image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: flowboard/web:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=web

      - name: Start the stack
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          sed -i "s|^FLOWBOARD_JWT_SECRET=.*|FLOWBOARD_JWT_SECRET=$(openssl rand -hex 32)|" deploy/.env
          sed -i "s|^FLOWBOARD_SEED_DEMO=.*|FLOWBOARD_SEED_DEMO=false|" deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait
          docker compose -f deploy/docker-compose.yml ps

      - name: Smoke test the running product through nginx
        # The assertions live in tools/ci-smoke.sh so that this job and a local
        # run execute the same file instead of two copies that can drift.
        env:
          BASE: http://localhost:8080
        run: |
          set -euo pipefail
          script=tools/ci-smoke.sh
          if [ ! -f "$script" ]; then
            echo "::error::$script is missing from the checkout — is it committed?"
            echo "workspace: ${GITHUB_WORKSPACE:-<unset>}"
            echo "cwd: $(pwd)"
            ls -la
            echo "--- tools/ ---"
            ls -la tools 2>/dev/null || echo "(no tools directory)"
            exit 1
          fi
          bash "$script"

      - name: Assert network isolation and container hardening
        # Same shared script as a local run; see tools/ci-isolation.sh.
        env:
          EDGE: http://localhost:8080
        run: |
          set -euo pipefail
          script=tools/ci-isolation.sh
          if [ ! -f "$script" ]; then
            echo "::error::$script is missing from the checkout — is it committed?"
            echo "workspace: ${GITHUB_WORKSPACE:-<unset>}"
            echo "cwd: $(pwd)"
            ls -la tools 2>/dev/null || echo "(no tools directory)"
            exit 1
          fi
          bash "$script"

      - name: Container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  publish:
    name: Publish images to GHCR
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/api
            ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true

      - name: Publish the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true